[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-max-adapter"
version = "0.1.0"
description = "Production-grade MAX Bot API adapter plugin for Hermes Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "redis>=5,<7",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
